[workspace]
members = [
    "crates/agent-core",
    "crates/obfuscate-macros",
    "crates/rag-chunking",
    "crates/rag-cli",
    "crates/rag-client",
    "crates/rag-core",
    "crates/rag-evidence",
    "crates/rag-license",
    "crates/rag-notifications",
    "crates/rag-sbom",
    "crates/rag-server",
    "crates/test-support",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.94.1"
version = "0.9.1"
license = "AGPL-3.0"
publish = false

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
async-trait = "0.1"
async-openai = { version = "0.32", features = [
    "chat-completion",
    "embedding",
] }
backoff = "0.4"
axum = { version = "0.7", features = ["macros", "json", "multipart"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"
futures = "0.3"
graph-flow = { version = "0.5", default-features = false }
hex = "0.4"
jsonwebtoken = "9"
parking_lot = "0.12"
qdrant-client = "1.16"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "multipart",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "json",
    "derive",
    "uuid",
    "chrono",
    "macros",
    "migrate",
] }
thiserror = "2.0"
tiktoken-rs = "0.9.1"
tokio = { version = "1.37", features = [
    "macros",
    "rt-multi-thread",
    "fs",
    "signal",
] }
toml = "0.8"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }
uuid = { version = "1", features = ["serde", "v4", "v5"] }
unicode-segmentation = "1.11"
unicode-normalization = "0.1"
walkdir = "2.5"
bm25 = "2.3.2"
regex-lite = "0.1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "builder",
    "tokio1-rustls-tls",
] }
handlebars = "6.2"
secrecy = "0.10.3"
tempfile = "3"
trait-variant = "0.1"
percent-encoding = "2.3"
image = { version = "0.25", default-features = false, features = ["png"] }
pdfium-render = { version = "0.8", features = ["image"] }
zip = { version = "8.1", default-features = false, features = ["deflate"] }

# Workspace-wide profile settings
[profile.dev]
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "abort"
