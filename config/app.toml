[app]
# Qdrant (vector database) settings
qdrant_url = "http://127.0.0.1:6334"                # gRPC endpoint
qdrant_timeout_secs = 30
qdrant_connect_timeout_secs = 5

# Postgres settings
postgres_max_connections = 10
postgres_connect_timeout_secs = 5

# BM25 sparse vector settings
bm25_avgdl = 300.0
bm25_k1 = 1.2
bm25_b = 0.75
bm25_query_b = 0.3

# Collection defaults
default_collection = "demo"

# Chunking defaults (overridable per-document via sidecar)
chunking_max_tokens = 600
chunking_overlap_ratio = 0.15

# Embedding settings
embedding_model = "text-embedding-3-small"          # OpenAI model (1536 dims)
embedder = "openai"                                 # Options: "openai", "mock"
embed_timeout_secs = 30
embed_max_retries = 3
embed_retry_backoff_ms = 500
embed_max_batch_tokens = 8192
embed_max_batch_size = 32

# Server settings
bind_addr = "0.0.0.0:8080"
# Runtime location of agent specs loaded by the Phase 9 agent API.
# Relative paths are anchored to this config file's directory.
agent_specs_dir = "agents"
# Optional allowlist for path-based ingestion. Requests to `/ingest` must
# resolve under one of these directories after canonicalization. Symlinks that
# resolve outside these roots are rejected. Leave empty to disable host-path
# ingestion and use `/ingest/upload` instead.
# ingest_allowed_roots = ["/srv/apex-docs"]

# Authentication
auth_mode = "none"                                  # Options: "none", "api-key", "oidc"
tenant_header = "x-tenant"
request_id_header = "x-request-id"

[retrieval]
rrf_k = 60                                          # RRF fusion k parameter
dense_top_k = 20                                    # Dense search result limit
sparse_top_k = 20                                   # Sparse/BM25 search result limit

[context]
max_tokens = 8000                                   # Token budget for assembled context
max_chunks = 50                                     # Max chunks in assembled context

[llm]
provider = "openai-compatible"                      # Options: "openai-compatible" (or "openai"), "anthropic"
model = "gpt-5.4-mini"
# base_url = "https://api.openai.com/v1"            # Default per provider
temperature = 0.1
max_tokens = 4096
timeout_secs = 60
max_retries = 3
retry_backoff_ms = 500
prompt_template_path = "prompts/chat_system.hbs"

[extract]
# Path to the PDFium native library (.dylib on macOS, .so on Linux)
# Omit to disable PDF extraction
# pdfium_library_path = "/usr/local/lib/libpdfium.dylib"
# Tesseract OCR fallback for scanned PDF pages.
# Path to tessdata directory (contains *.traineddata files).
# Omit to disable OCR fallback. TESSDATA_PREFIX env var overrides this.
# tessdata_dir = "/usr/local/share/tessdata"
# Default timeout for Tesseract subprocess per page (seconds).
# ocr_timeout_secs = 30
# Default OCR language (Tesseract language code).
# ocr_default_language = "eng"

[auth]
# OIDC settings (required when auth_mode = "oidc")
# oidc_issuer = "https://auth.example.com"
# oidc_audience = "apex-api"
# oidc_jwks_url = ""                                    # Override OIDC discovery JWKS URL
# oidc_groups_claim = "groups"                          # JWT claim for group membership
# oidc_platform_operator_groups = []                    # Groups that grant platform_operator role
# bootstrap_platform_api_key = ""                       # Break-glass API key (first deploy/recovery only)

[rate_limit]
global_rps = 1000                                       # Global requests per second
global_burst = 200                                      # Global burst allowance
global_concurrency = 100                                # Max concurrent requests
tenant_rps = 100                                        # Per-tenant requests per second
tenant_burst = 50                                       # Per-tenant burst allowance
