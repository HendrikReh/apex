[app]
# Qdrant (vector database) settings
qdrant_url = "http://127.0.0.1:6334"                # gRPC endpoint
qdrant_timeout_secs = 30
qdrant_connect_timeout_secs = 5

# Postgres settings
postgres_max_connections = 10
postgres_connect_timeout_secs = 5

# BM25 sparse vector settings
bm25_avgdl = 300.0
bm25_k1 = 1.2
bm25_b = 0.75
bm25_query_b = 0.3

# Collection defaults
default_collection = "hybrid_docs"

# Chunking defaults (overridable per-document via sidecar)
chunking_max_tokens = 600
chunking_overlap_ratio = 0.15

# Embedding settings
embedding_model = "text-embedding-3-small"          # OpenAI model (1536 dims)
embedder = "openai"                                 # Options: "openai", "mock"
embed_timeout_secs = 30
embed_max_retries = 3
embed_retry_backoff_ms = 500
embed_max_batch_tokens = 8192
embed_max_batch_size = 32

# Server settings
bind_addr = "0.0.0.0:8080"

# Authentication
auth_mode = "none"                                  # Options: "none", "api-key", "oidc"
tenant_header = "x-tenant"
request_id_header = "x-request-id"

[retrieval]
rrf_k = 60                                          # RRF fusion k parameter
dense_top_k = 20                                    # Dense search result limit
sparse_top_k = 20                                   # Sparse/BM25 search result limit

[context]
max_tokens = 8000                                   # Token budget for assembled context
max_chunks = 50                                     # Max chunks in assembled context
